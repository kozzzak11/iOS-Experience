name: Android keyboard verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Experience-0.1.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: app/build/reports/
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify IME on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/verify-ime.sh
      - name: Upload device results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/device-diagnostics/

  release:
    needs: [build, emulator]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Experience-0.1.0-APK
          path: apk
      - name: Publish verified development APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cp apk/app-debug.apk iOS-Experience.apk
          gh release view v0.1.0 >/dev/null 2>&1 || gh release create v0.1.0 --target "$RELEASE_COMMIT" --title 'iOS Experience 0.1.0 — Keyboard' --notes 'Development APK. RU/EN keyboard and Unicode emoji panel. Unit tests, lint and Android 16 emulator integration passed. Not tested on a physical Nothing phone. Apple emoji artwork and launcher are not included. Development signing may differ from the earlier local APK.'
          gh release upload v0.1.0 iOS-Experience.apk --clobber
